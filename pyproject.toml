[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "germany-job-ease-index"
version = "0.1.0"
description = "How easy is it to land a job in each German city, by type of work? Public BA and Destatis data, modelled with dbt on DuckDB."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "dagster-webserver>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl",
]
notebooks = [
    "marimo>=0.10",
    "altair>=5.4",
    "pandas>=2.2",
]
video = [
    "playwright>=1.45",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
jobease = "jobease.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobease"]

[tool.dagster]
module_name = "jobease.orchestration.definitions"
code_location_name = "jobease"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "TID"]
# "×" is meant: ratios are written "×2.3", in code comments and in published text alike.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# marimo cells are all named `_`, and a cell shows its last expression.
"notebooks/**/*.py" = ["F811", "B018"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobease"]

[[tool.mypy.overrides]]
module = ["jobease.orchestration.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["dagster_dbt.*", "imageio_ffmpeg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
